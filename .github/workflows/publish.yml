name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC). No long-lived API token is stored.
# Triggered only when a GitHub release is published. The release tag must be
# "v<project.version>" (for example "v0.1.0"), otherwise the build job fails.

on:
  release:
    types: [published]

# Deny all token permissions by default; each job opts in to what it needs.
permissions: {}

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG_NAME}" != "v${version}" ]; then
            echo "Release tag '${TAG_NAME}' does not match 'v${version}' from pyproject.toml" >&2
            exit 1
          fi

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest

      - name: Run tests
        run: |
          python -m pip install -e .
          python -m pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pacman-apt-wrapper
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
