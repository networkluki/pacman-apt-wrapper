[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-apt-wrapper"
version = "0.1.0"
description = "Pacman-style wrapper for apt-get/apt-cache/dpkg-query"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "networkluki" }]
keywords = ["pacman", "apt", "debian", "ubuntu", "cli", "wrapper"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/networkluki/pacman-apt-wrapper"
Issues = "https://github.com/networkluki/pacman-apt-wrapper/issues"

[project.scripts]
pacman-apt = "pacman_apt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
