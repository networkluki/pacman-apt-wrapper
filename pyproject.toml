[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-apt-wrapper"
version = "0.1.0"
description = "Pacman-style wrapper for apt-get/apt-cache/dpkg-query"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pacman Apt Wrapper Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/networkluki/pacman-apt-wrapper"
Source = "https://github.com/networkluki/pacman-apt-wrapper"
Issues = "https://github.com/networkluki/pacman-apt-wrapper/issues"

[project.scripts]
pacman-apt = "pacman_apt.cli:main"
pacman = "pacman_apt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
